<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Partner Resources · The Operator Standard</title>
  <link rel="icon" href="assets/bison-white.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Inter.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/GeistMono.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#home" aria-label="The Operator Standard Partner Resources, home">
      <img src="assets/bison-white.svg" alt="" width="61" height="43">
    </a>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>
      <span>Home</span>
    </a>
    <a href="#replays" data-tab="replays">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
      <span>Replays</span>
    </a>
    <a href="#tutorials" data-tab="tutorials">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>
      <span>Tutorials</span>
    </a>
    <a href="#guides" data-tab="guides">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v4h4M9 12.5h6M9 16h6"/></svg>
      <span>Guides</span>
    </a>
  </nav>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-bar">
      <span class="grab" aria-hidden="true"></span>
      <button class="icon-btn" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="sheet-body"></div>
  </dialog>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
